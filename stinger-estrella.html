<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="stinger" content="2000 1000">
<title>Stinger — Estrella roja</title>
<link rel="stylesheet" href="css/theme.css">
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<!--
  STINGER "ESTRELLA ROJA" — 2.0 s, punto de transición 1000 ms
  Círculo rojo y círculo oscuro que se abren desde el centro, rayos de cartel
  soviético girando y una estrella que entra girando y sale disparada hacia la cámara.
  ?loop=1 para previsualizar · vídeo: render/stinger-estrella.webm
-->
<style>
  .stage { position: absolute; inset: 0; overflow: hidden; }
  .disc { position: absolute; inset: 0; clip-path: circle(0% at 50% 50%); }
  .d1 { background: var(--acc); }
  .d2 { background: radial-gradient(circle at 50% 50%, #3a0d0a 0%, #160806 55%, #0b100c 100%); }
  .play .d1 { animation: d1 2s both; }
  .play .d2 { animation: d2 2s both; }
  @keyframes d1 {
    0%, 4% { clip-path: circle(0% at 50% 50%); animation-timing-function: cubic-bezier(.7,0,.3,1); }
    30%, 66% { clip-path: circle(75% at 50% 50%); animation-timing-function: cubic-bezier(.7,0,.3,1); }
    92%, 100% { clip-path: circle(0% at 50% 50%); }
  }
  @keyframes d2 {
    0%, 10% { clip-path: circle(0% at 50% 50%); animation-timing-function: cubic-bezier(.7,0,.3,1); }
    36%, 60% { clip-path: circle(75% at 50% 50%); animation-timing-function: cubic-bezier(.7,0,.3,1); }
    85%, 100% { clip-path: circle(0% at 50% 50%); }
  }

  /* Rayos de cartel */
  .rays { position: absolute; left: 50%; top: 50%; width: 2600px; height: 2600px; margin: -1300px; opacity: 0;
    background: repeating-conic-gradient(from 0deg, rgba(200,48,42,.55) 0 7.5deg, transparent 7.5deg 15deg);
    -webkit-mask: radial-gradient(circle, transparent 120px, #000 260px, #000 60%, transparent 72%); }
  .play .rays { animation: rays 2s both; }
  @keyframes rays { 0%, 22% { opacity: 0; transform: rotate(0) } 34%, 58% { opacity: 1 } 66%, 100% { opacity: 0; transform: rotate(40deg) } }

  /* Estrella */
  .star-big { position: absolute; left: 50%; top: 44%; width: 300px; height: 300px; margin: -150px; opacity: 0; }
  .star-big svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 30px rgba(214,169,58,.5)); }
  .play .star-big { animation: star 2s both; }
  @keyframes star {
    0%, 18% { opacity: 0; transform: scale(0) rotate(-200deg); animation-timing-function: cubic-bezier(.2,1.4,.4,1); }
    40% { opacity: 1; transform: scale(1) rotate(0); }
    56% { opacity: 1; transform: scale(1.06) rotate(0); animation-timing-function: cubic-bezier(.6,0,.9,.5); }
    66%, 100% { opacity: 0; transform: scale(9) rotate(25deg); }
  }

  .txt { position: absolute; left: 0; right: 0; top: 64%; text-align: center; opacity: 0; }
  .txt .n { font-family: var(--f-head); font-size: 96px; line-height: 1; color: var(--txt); letter-spacing: .04em; text-shadow: 0 6px 30px rgba(0,0,0,.6); }
  .txt .r { margin-top: 14px; font-family: var(--f-mono); font-size: 28px; letter-spacing: .55em; color: var(--gold); }
  .play .txt { animation: txt 2s both; }
  @keyframes txt { 0%, 34% { opacity: 0; transform: translateY(30px); filter: blur(6px) } 44%, 56% { opacity: 1; transform: none; filter: none } 64%, 100% { opacity: 0; transform: translateY(-20px); filter: blur(6px) } }

  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  .play .flash { animation: flash 2s both; }
  @keyframes flash { 0%, 58% { opacity: 0 } 61% { opacity: .55 } 70%, 100% { opacity: 0 } }
</style>
</head>
<body>
<div class="stage play" id="stage">
  <div class="disc d1"></div>
  <div class="disc d2"></div>
  <div class="rays"></div>
  <div class="star-big">
    <svg viewBox="-50 -50 100 100">
      <polygon points="0,-48 11.2,-15.5 45.6,-14.8 18.1,5.9 28.2,38.8 0,19 -28.2,38.8 -18.1,5.9 -45.6,-14.8 -11.2,-15.5" fill="#c8302a" stroke="#d6a93a" stroke-width="3.5" stroke-linejoin="round"/>
      <polygon points="0,-30 6.8,-9.4 27.7,-9 11,3.6 17.1,23.6 0,11.5 -17.1,23.6 -11,3.6 -27.7,-9 -6.8,-9.4" fill="none" stroke="#d6a93a" stroke-width="1.2" opacity=".7"/>
    </svg>
  </div>
  <div class="txt"><div class="n" data-cfg="canal">FUERZAS RUSAS</div><div class="r">ВПЕРЁД, ТОВАРИЩИ!</div></div>
  <div class="flash"></div>
</div>
<script>stingerLoop();</script>
</body>
</html>
