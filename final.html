<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Final — Fin de transmisión</title>
<link rel="stylesheet" href="css/theme.css">
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<!--
  FINAL / OUTRO
  ?titulo=MISIÓN CUMPLIDA
  ?proximo=VIERNES 21:00     próxima transmisión
  ?creditos=Nombre1|Nombre2|Nombre3   (escuadra / mods / agradecimientos)
  ?bajas=24&objetivos=5&tiempo=3h 12m   (estadísticas opcionales)
-->
<style>
  .center { position: absolute; left: 140px; top: 110px; width: 1050px; }
  .stamp { display: inline-block; font-family: var(--f-head); font-size: 40px; color: var(--acc); border: 5px solid var(--acc);
    padding: 6px 24px; transform: rotate(-4deg); opacity: 0; animation: stamp .5s 1.2s cubic-bezier(.3,1.6,.5,1) forwards; }
  @keyframes stamp { from { opacity: 0; transform: rotate(-4deg) scale(2.2) } to { opacity: 1; transform: rotate(-4deg) scale(1) } }
  h1 { font-family: var(--f-head); font-size: 140px; line-height: .95; margin-top: 30px; text-transform: uppercase; }
  .sub { font-size: 40px; font-weight: 600; color: var(--khaki); margin-top: 20px; }
  .stats { display: flex; gap: 20px; margin-top: 50px; }
  .stat { min-width: 220px; padding: 18px 24px; border: 1px solid var(--line); background: rgba(20,26,17,.8); position: relative; }
  .stat b { display: block; font-family: var(--f-mono); font-size: 64px; color: var(--acc); line-height: 1; font-weight: 400; }
  .stat span { font-family: var(--f-mono); font-size: 20px; color: var(--muted); letter-spacing: .25em; }
  .next { margin-top: 50px; display: flex; align-items: center; gap: 24px; font-family: var(--f-mono); font-size: 30px; letter-spacing: .15em; }
  .next b { background: var(--acc); color: var(--on-acc); padding: 10px 20px; font-weight: 400; }

  .socials { position: absolute; left: 140px; bottom: 70px; display: flex; gap: 40px; font-family: var(--f-mono); font-size: 28px; color: var(--txt); }
  .socials div::before { content: '▸ '; color: var(--acc); }

  .credits { position: absolute; right: 140px; top: 120px; bottom: 120px; width: 520px; overflow: hidden;
    border-left: 3px solid var(--acc); padding-left: 40px; background: rgba(11,16,12,.82);
    -webkit-mask: linear-gradient(transparent, #000 15%, #000 85%, transparent); }
  .roll { animation: roll var(--d, 30s) linear infinite; text-align: left; }
  @keyframes roll { from { transform: translateY(840px) } to { transform: translateY(-100%) } }
  .roll h4 { font-family: var(--f-mono); color: var(--acc); font-size: 22px; letter-spacing: .3em; margin: 40px 0 12px; font-weight: 400; }
  .roll p { font-size: 34px; font-weight: 600; line-height: 1.4; }

  .in { opacity: 0; animation: in .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(30px) } to { opacity: 1; transform: none } }
  .fade { position: absolute; inset: 0; background: #000; animation: fade 1.2s forwards; pointer-events: none; }
  @keyframes fade { to { opacity: 0 } }
</style>
</head>
<body class="solid">
<div class="photo-bg"></div>
<div class="noise"></div>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="center">
  <div class="stamp">КОНЕЦ ЭФИРА // FIN DE TRANSMISIÓN</div>
  <div class="ru in" style="animation-delay:.2s;font-size:26px;margin-top:30px;color:var(--khaki)">МИССИЯ ВЫПОЛНЕНА</div>
  <h1 class="in" id="titulo" style="animation-delay:.3s">Misión<br>cumplida</h1>
  <div class="sub in" style="animation-delay:.5s">Gracias por desplegar con <span data-cfg="canal" class="acc"></span></div>
  <div class="stats in" id="stats" style="animation-delay:.7s"></div>
  <div class="next in" id="next" style="animation-delay:.9s"><span>PRÓXIMA OPERACIÓN</span><b id="prox"></b></div>
</div>

<div class="socials in" id="soc" style="animation-delay:1.1s"></div>

<div class="credits"><div class="roll" id="roll"></div></div>

<div class="fade"></div>

<script>
  const tt = P('titulo', ''); if (tt) document.getElementById('titulo').textContent = tt;
  const prox = P('proximo', 'PRONTO'); document.getElementById('prox').textContent = prox.toUpperCase();

  const stats = [['bajas', 'BAJAS'], ['objetivos', 'OBJETIVOS'], ['tiempo', 'EN SERVICIO']].filter(([k]) => P(k, '') !== '');
  const sb = document.getElementById('stats');
  if (!stats.length) sb.style.display = 'none';
  stats.forEach(([k, l]) => sb.insertAdjacentHTML('beforeend', `<div class="stat"><div class="brackets" style="--b:14px;--t:2px"><i></i></div><b>${P(k)}</b><span>${l}</span></div>`));

  document.getElementById('soc').innerHTML = PL('redes', []).map(r => `<div>${r}</div>`).join('');

  const names = PL('creditos', 'Escuadra Alfa|Escuadra Bravo|Logística|Pilotos de transporte');
  const sections = [
    ['EN EL CAMPO // НА ПОЛЕ БОЯ', names],
    ['AGRADECIMIENTOS', ['A todos los que han visto el directo', 'Moderadores', 'Comunidad del servidor']],
    ['JUEGO', ['Arma Reforger — Bohemia Interactive']],
    ['EMITIDO POR', [P('canal')]]
  ];
  document.getElementById('roll').innerHTML = sections.map(([h, l]) => `<h4>// ${h}</h4>` + l.map(n => `<p>${n}</p>`).join('')).join('');
</script>
</body>
</html>
