<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Escuadra — Roster</title>
<link rel="stylesheet" href="css/theme.css">
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<!--
  ROSTER DE ESCUADRA — panel lateral izquierdo
  ?escuadra=БЕРКУТ
  ?m=Nombre:ROL:estado|Nombre:ROL:estado   estado = ok | herido | baja
     roles: КО (jefe), САН (médico), ГРН (lanzagranadas/AT), ПУЛ (ametralladora),
            СТР (fusilero), СНП (tirador), РАД (radio), ИНЖ (ingeniero)
  EN DIRECTO ("Interactuar"): clic en un soldado = cambia su estado
-->
<style>
  .panel { position: absolute; left: 40px; top: 50%; transform: translateY(-50%); width: 440px; user-select: none;
    background: rgba(10,13,9,.88); border: 1px solid var(--line); border-left: 4px solid var(--acc);
    opacity: 0; animation: in .6s .2s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translate(-30px, -50%) } to { opacity: 1; transform: translateY(-50%) } }
  .hd { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .hd b { font-family: var(--f-head); font-size: 30px; font-weight: 400; }
  .hd span { font-family: var(--f-mono); font-size: 16px; color: var(--acc); letter-spacing: .1em; white-space: nowrap; }
  .mb { display: grid; grid-template-columns: 54px 1fr auto; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid rgba(201,187,139,.1);
    cursor: pointer; opacity: 0; animation: row .4s forwards; }
  @keyframes row { from { opacity: 0; transform: translateX(-12px) } to { opacity: 1; transform: none } }
  .role { height: 30px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 16px; background: var(--olive); color: var(--khaki); border: 1px solid var(--olive2); }
  .SL .role { background: var(--acc); color: var(--on-acc); border-color: var(--acc); }
  .nm { font-size: 26px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stt { width: 12px; height: 12px; border-radius: 50%; background: var(--fia); box-shadow: 0 0 8px var(--fia); }
  .herido .stt { background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: blink 1s steps(1) infinite; }
  .baja { opacity: .45 !important; } .baja .nm { text-decoration: line-through; } .baja .stt { background: var(--red); box-shadow: none; }
  .ft { padding: 10px 20px; font-family: var(--f-mono); font-size: 15px; color: var(--muted); letter-spacing: .15em; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="panel">
  <div class="hd"><b>ОТДЕЛЕНИЕ <span id="sq" style="font:inherit;color:var(--acc);letter-spacing:0"></span></b><span id="cnt"></span></div>
  <div id="list"></div>
  <div class="ft"><span>ЧАСТОТА 45.6 MHz</span><span id="ck"></span></div>
</div>
<script>
  document.getElementById('sq').textContent = P('escuadra', 'БЕРКУТ').toUpperCase();
  const def = 'Volkov:КО:ok|Petrov:САН:ok|Smirnov:ГРН:ok|Sokolov:ПУЛ:herido|Ivanov:СТР:ok|Kuznetsov:РАД:ok';
  const M = PL('m', def).map(s => { const [n, r, e] = s.split(':'); return { n, r: (r || 'СТР').toUpperCase(), e: e || 'ok' }; });
  const ST = ['ok', 'herido', 'baja'];
  function render() {
    document.getElementById('list').innerHTML = M.map((m, i) =>
      `<div class="mb ${m.r === 'КО' || m.r === 'SL' ? 'SL' : ''} ${m.e}" data-i="${i}" style="animation-delay:${.35 + i * .07}s"><span class="role">${m.r}</span><span class="nm">${m.n}</span><i class="stt"></i></div>`).join('');
    document.getElementById('cnt').textContent = M.filter(m => m.e !== 'baja').length + '/' + M.length + ' В СТРОЮ';
  }
  document.getElementById('list').addEventListener('click', e => {
    const r = e.target.closest('.mb'); if (!r) return;
    const m = M[+r.dataset.i]; m.e = ST[(ST.indexOf(m.e) + 1) % 3];
    r.className = `mb ${m.r === 'КО' || m.r === 'SL' ? 'SL' : ''} ${m.e}`; r.style.animation = 'none'; r.style.opacity = '';
    document.getElementById('cnt').textContent = M.filter(m => m.e !== 'baja').length + '/' + M.length + ' В СТРОЮ';
  });
  render();
  const ck = document.getElementById('ck'); const u = () => ck.textContent = clockStr(); u(); setInterval(u, 1000);
</script>
</body>
</html>
